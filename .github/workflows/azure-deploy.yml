name: Deploy to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    # 1. Check out the repository
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    # 2. Add your specific build steps here (e.g., Setup Node/Python/Dotnet, build commands)

    # 3. Deploy directly via Publish Profile
    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'phylexnew-bueacfd8ctbchbc3' # Replace with your exact app name
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
